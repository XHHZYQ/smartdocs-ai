[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartdocs-ai"
version = "0.1.0"
description = "A smart document management system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.2",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.20",
    "alembic>=1.19.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
dev = "app.cli:dev"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # 常见错误、未使用变量、import 排序、语法升级建议
ignore = []

[tool.ruff.format]
quote-style = "double"

# SmartDocs Nginx 反代配置
# 职责：80 端口入口、反代到 api:8000、SSE 流式透传
#
# 重点设计：SSE 不能被 nginx 缓冲，否则打字机效果变成"卡顿到缓冲完一次吐"
# 解决：proxy_buffering off + 上游响应头 X-Accel-Buffering: no 双保险

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 日志格式：JSON 化，与后端日志一致，方便采集/检索
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes_sent":$body_bytes_sent,"duration_sec":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # 上游 API 服务
    upstream smartdocs_api {
        server api:8000;
        # 容器编排里 api 服务名叫 api，compose DNS 解析
    }

    server {
        listen 80;
        server_name _;

        # 健康检查直通（探活频繁，不走反代逻辑省事）
        location = /health {
            proxy_pass http://smartdocs_api;
            access_log off;  # 健康检查不记日志，避免刷屏
        }

        # SSE 流式问答：必须关缓冲
        # /chat 路径走 StreamingResponse + text/event-stream
        location /chat {
            proxy_pass http://smartdocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # === SSE 透传关键配置 ===
            proxy_buffering off;        # 关响应缓冲，chunk 立即转发
            proxy_cache off;            # 不缓存
            proxy_request_buffering off;  # 请求也不缓冲，POST body 直传

            # LLM 慢响应：read 默认 60s 会超时，提到 10 分钟
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # 双保险：上游响应头加 X-Accel-Buffering: no
            # 即使个别路径忘了关 buffering，浏览器收到这个头也会禁用
            add_header X-Accel-Buffering no;
        }

        # 其他所有路径：常规反代
        location / {
            proxy_pass http://smartdocs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 普通接口允许缓冲，性能更好
            proxy_buffering on;
            proxy_read_timeout 60s;
        }
    }
}

# 生产栈（EC2）—— 完全独立的一份文件，不与 docker-compose.yml 叠加
#
# 用法（CI 自动执行，一般不用手动）：
#   export IMAGE_TAG=sha-abc1234
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# 与本地文件的差异：
#   - api/worker 从 GHCR 拉现成镜像，不在服务器上构建
#   - 数据库和 redis 也跑容器（单机全栈），但端口不暴露到宿主
#   - 多一个 migrate 一次性服务，负责 alembic upgrade head
#   - restart: always + 日志大小上限，防止跑满磁盘

name: smartdocs-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    # 故意不映射端口：数据库只对内网 compose 网络可见
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - smartdocs

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging
    networks:
      - smartdocs

  # 一次性迁移任务：跑完就退出，不常驻
  # 由 deploy.sh 显式调用，restart: "no" 保证它不会被自动拉起
  migrate:
    image: ${IMAGE_NAME:-ghcr.io/xhhzyq/smartdocs-ai}:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 迁移脚本会 import app 的模块，Redis 地址也得是容器内的
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - smartdocs

  api:
    image: ${IMAGE_NAME:-ghcr.io/xhhzyq/smartdocs-ai}:${IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
      - logs:/app/logs
    # 不暴露 8000：外部流量只能从 nginx 进
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - smartdocs

  worker:
    image: ${IMAGE_NAME:-ghcr.io/xhhzyq/smartdocs-ai}:${IMAGE_TAG:-latest}
    restart: always
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
      - logs:/app/logs
    # worker 是 arq 进程，不监听 HTTP；镜像自带的 HEALTHCHECK（探 8000）对它必然失败，
    # 这里显式禁用，避免永远 unhealthy 的误报
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - smartdocs

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro  # 覆盖默认配置
    ports:
      # 只开 80：目前没有 TLS 证书，不映射 443
      # （nginx.conf 里也只有 listen 80，映射 443 只会起一个握手必失败的空端口）
      - "0.0.0.0:80:80"
    depends_on:
      - api
    # 启动后做一次公网可达性体检：容器内就绪 ≠ 公网能访问。
    # 之前发生过安全组未开放 80、部署显示成功但用户完全访问不到的情况。
    # EC2 无法 curl 自己的公网 IP（AWS 不支持 hairpin NAT），所以借第三方节点外部探测。
    # 探测服务不可用时只打印警告，不阻塞部署。
    post_start:
      - command: >
          sh -c 'r=$$(curl -s -m 20 -H "Accept: application/json"
          "https://check-host.net/check-http?host=http%3A%2F%2F$${PUBLIC_HOST}%2Fhealth&max_nodes=2");
          id=$$(printf "$$s" "$$r" | sed -n "s/.*\"request_id\":\"\([^\"]*\)\".*/\1/p");
          if [ -z "$$id" ]; then echo "[warn] 外部探测服务无响应，跳过公网检查"; exit 0; fi;
          sleep 10;
          resp=$$(curl -s -m 20 -H "Accept: application/json"
          "https://check-host.net/check-result/$$id");
          if printf "$$s" "$$resp" | grep -q "timed out\|Connection refused"; then
            echo "[FAIL] 公网 $${PUBLIC_HOST}:80 不可达！最常见原因：安全组未开放 80 端口。";
            echo "       修复：EC2 控制台 → 安全组 → 入站规则 → TCP 80 → 0.0.0.0/0";
          else echo "[ok] 公网 $${PUBLIC_HOST}:80 可达"; fi'
        environment:
          PUBLIC_HOST: "${PUBLIC_HOST:-54.254.154.60}"
    logging: *default-logging
    networks:
      - smartdocs

networks:
  smartdocs:
    driver: bridge

volumes:
  pgdata:
  uploads:
  logs:

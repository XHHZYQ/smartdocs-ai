# SmartDocs CI: lint → test → build → 推 ECR（仅 main）
#
# 设计要点：
# - lint/test 在 PR 上跑，质量门禁
# - build+push 只在 main 分支跑，避免每个 PR 都构建镜像
# - test 需要 PostgreSQL（pgvector）作为 service container
#   conftest.py 直接用真实 DB 建表，不用 mock
# - build 用 buildx linux/amd64，给 EC2 用
# - 推 ECR 用 OIDC 无密钥认证（避免在 GitHub 配长期 AWS access key）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支并发时取消旧 run，省 CI 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  # ===== lint：ruff check + format check =====
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # ===== test：pytest + PostgreSQL pgvector service container =====
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint  # lint 不过不浪费资源跑 test

    # 用 service container 起 pgvector
    # 等价于本地 docker run pgvector/pgvector:pg16
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartdocs
          POSTGRES_PASSWORD: smartdocs
          POSTGRES_DB: smartdocs_test
        ports:
          - 5432:5432
        # service container 没法挂 init.sql，这里用命令行建扩展
        options: >-
          --health-cmd "pg_isready -U smartdocs -d smartdocs_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://smartdocs:smartdocs@localhost:5432/smartdocs_test
      REDIS_URL: redis://localhost:6379/0
      ARQ_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-test-only
      EMBEDDING_API_KEY: test-fake-key
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Create pgvector extension
        # service container 不跑 init.sql，手动建扩展
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U smartdocs -d smartdocs_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        run: uv run pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ===== build + push ECR（仅 main 分支） =====
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test  # test 不过不构建
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      # OIDC 无密钥认证推 ECR 必需
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
          const token = await core.getIDToken('sts.amazonaws.com');
          const payload = JSON.parse(
            Buffer.from(token.split('.')[1], 'base64url').toString()
          );
          console.log(JSON.stringify({
            iss: payload.iss,
            aud: payload.aud,
            sub: payload.sub,
            repository: payload.repository,
            repository_id: payload.repository_id,
            repository_owner: payload.repository_owner,
            repository_owner_id: payload.repository_owner_id,
            ref: payload.ref
          }, null, 2));

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # tag 用 commit short sha，方便回溯
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO }}:latest
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPO }}:${{ github.sha }}
          # 缓存到 GHA，加速下次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== 触发部署（CD 由 EC2 上 pull 完成） =====
  # 单独 job：build 成功才触发，避免推送失败镜像
  deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # 不需要额外权限，用 repository_dispatch 或 workflow_dispatch 都太重
    # 实际部署用 SSH 直连 EC2 执行 deploy.sh（见步骤 6）
    steps:
      - uses: actions/checkout@v4

      - name: Trigger EC2 deploy via SSH
        # 用 appleboy/ssh-action 在 EC2 上执行 pull+restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/smartdocs
            ./scripts/deploy.sh

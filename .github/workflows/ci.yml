name: CI/CD

# 一个文件管全流程：
#   PR / 任意分支 push  → 只跑 test
#   main 分支 push      → test → 构建推送 GHCR → SSH 部署到 EC2
#
# 没有 lint 环节（ruff 不进 CI），要跑自己在本地 uv run ruff check .

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ==================== 1. 测试 ====================
  test:
    name: 测试
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: smartdocs
          POSTGRES_PASSWORD: smartdocs
          POSTGRES_DB: smartdocsdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartdocs -d smartdocsdb"
          --health-interval 10s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: 创建测试数据库
        run: |
          psql -h localhost -U smartdocs -d smartdocsdb -c "CREATE DATABASE smartdocs_test;"
        env:
          PGPASSWORD: smartdocs

      - name: pytest
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://smartdocs:smartdocs@localhost:5432/smartdocsdb
          REDIS_URL: redis://localhost:6379/0
          ARQ_REDIS_URL: redis://localhost:6379/1
          JWT_SECRET_KEY: 5d71e2ef8005d55e3277359c96786c3a7e2e53cc9f6476807e5f19723266dcc8
          EMBEDDING_API_KEY: ci-only-key
          EMBEDDING_BASE_URL: https://example.invalid/v1
          EMBEDDING_MODEL: BAAI/bge-m3
          CHAT_MODEL: ci-only-model
          RATE_LIMIT_ENABLED: "false"
          DEBUG: "true"
          # 测试里如果还报缺别的变量，往这里补即可

  # ==================== 2. 构建 + 推送镜像 ====================
  build:
    name: 构建推送镜像
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      # Docker 镜像名必须全小写，而 GitHub 用户名可能是 XHHZYQ 这种带大写的
      - name: 计算镜像名与 tag
        id: meta
        run: |
          echo "tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 3. 部署到 EC2 ====================
  deploy:
    name: 部署到 EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 引号包裹的 heredoc 定界符：不做变量替换，避免 .env 里的 $ 被 shell 吃掉
      - name: 生成 .env
        run: |
          cat > .env <<'SMARTDOCS_EOF'
          ${{ secrets.ENV_PROD }}
          SMARTDOCS_EOF

      # 部署所需文件全部推过去，EC2 上不需要 clone 代码、不需要手工放配置
      - name: 上传部署文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env,docker-compose.prod.yml,scripts/deploy.sh,docker/nginx/nginx.conf,docker/postgres/init.sql"
          target: /opt/smartdocs

      - name: 执行部署脚本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/smartdocs
            chmod +x scripts/deploy.sh

            # 镜像设为 public 时这段不会执行；私有镜像配 GHCR_PAT 才需要
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            fi

            IMAGE_TAG='${{ needs.build.outputs.tag }}' \
            IMAGE_NAME='${{ env.REGISTRY }}/${{ needs.build.outputs.image }}' \
              bash scripts/deploy.sh

      - name: 部署结果
        if: always()
        run: |
          echo "镜像: ${{ env.REGISTRY }}/${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}"
          echo "地址: http://${{ secrets.EC2_HOST }}"

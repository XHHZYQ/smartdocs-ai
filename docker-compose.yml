# 本地开发栈：postgres(pgvector) + redis + api + worker + nginx
#
# 用法：
#   cp .env.example .env      # 第一次跑之前
#   docker compose up -d --build
#   curl http://localhost/health
#
# 改了源码后重建：docker compose up -d --build api worker
# 完全重置（连数据一起删）：docker compose down -v
#
# 注意：这个文件 100% 自包含，不依赖任何其他 compose 文件。
# 生产请用 docker-compose.prod.yml，两者不叠加使用。

name: smartdocs

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smartdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdocs}
      POSTGRES_DB: ${POSTGRES_DB:-smartdocsdb}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # 宿主端口放 .env 里改，避免和本机已装的 postgres 撞车
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdocs} -d ${POSTGRES_DB:-smartdocsdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - smartdocs

  redis:
    image: redis:7-alpine
    container_name: smartdocs-redis
    restart: unless-stopped
    # 不开持久化：缓存和队列丢得起，省磁盘；任务状态以 DB 为准
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - smartdocs

  # api 和 worker 共用一次构建：都写了 image: 后 compose 只构建一遍
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartdocs-ai:local
    container_name: smartdocs-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器间用服务名通信，localhost 在容器里指的是自己
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartdocs}:${POSTGRES_PASSWORD:-smartdocs}@postgres:5432/${POSTGRES_DB:-smartdocsdb}
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartdocs

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartdocs-ai:local
    container_name: smartdocs-worker
    restart: unless-stopped
    # 覆盖 Dockerfile 的 CMD，同一个镜像跑成 arq worker
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartdocs}:${POSTGRES_PASSWORD:-smartdocs}@postgres:5432/${POSTGRES_DB:-smartdocsdb}
      REDIS_URL: redis://redis:6379/0
      ARQ_REDIS_URL: redis://redis:6379/1
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartdocs

  nginx:
    image: nginx:alpine
    container_name: smartdocs-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    # 只用普通依赖：api 挂了 nginx 照常在线返回 502，
    # 比"nginx 一起不启动、健康检查拿到 connection refused"好排查
    depends_on:
      - api
    networks:
      - smartdocs

networks:
  smartdocs:
    driver: bridge

volumes:
  pgdata:
  uploads:
  logs:
